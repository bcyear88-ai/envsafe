<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全环保工作监督系统 · 水泥企业</title>
<link rel="stylesheet" href="/libs/element-plus.css?v=1787016030">
<style>
:root{
  --primary:#1d5fa4;--primary-light:#2e7ec9;--primary-dark:#144477;
  --success:#16a34a;--warning:#f59e0b;--danger:#dc2626;
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;
  --text:#1e293b;--text-2:#475569;--text-3:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body,#app{height:100%;font-family:-apple-system,"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;color:var(--text)}
body{background:var(--bg)}

/* ====== 登录页 ====== */
.login-wrap{
  height:100vh;background:linear-gradient(135deg,#0f2540 0%,#1d5fa4 50%,#2e7ec9 100%);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.login-wrap::before{
  content:"";position:absolute;inset:0;background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.06) 0,transparent 40%);
}
.login-card{
  background:#fff;border-radius:16px;padding:48px 44px;width:420px;
  box-shadow:0 25px 70px rgba(0,0,0,.35);position:relative;z-index:1;
}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .logo-icon{
  width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--primary-light));
  border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:28px;font-weight:700;letter-spacing:-1px;
  box-shadow:0 8px 20px rgba(29,95,164,.4);
}
.login-logo h1{font-size:20px;color:var(--text);letter-spacing:.5px}
.login-logo p{font-size:13px;color:var(--text-3);margin-top:6px}
.login-card .el-form-item{margin-bottom:22px}
.login-card .el-input__wrapper{border-radius:8px!important;box-shadow:0 0 0 1px #e2e8f0 inset!important}
.login-card .el-input__wrapper.is-focus{box-shadow:0 0 0 2px var(--primary) inset!important}
.login-btn{
  width:100%;height:44px;border-radius:8px;font-size:15px;font-weight:500;
  background:linear-gradient(135deg,var(--primary),var(--primary-light))!important;
  border:none!important;
}
.login-tip{text-align:center;font-size:12px;color:var(--text-3);margin-top:18px}
.login-tip span{color:var(--primary);cursor:pointer;margin:0 4px}

/* ====== 主布局 ====== */
.layout{height:100vh;display:flex;overflow:hidden}
.sidebar{
  width:228px;background:linear-gradient(180deg,#0f2540 0%,#163a63 100%);
  color:#fff;display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-brand{
  padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.sidebar-brand .logo-mini{
  width:36px;height:36px;background:linear-gradient(135deg,var(--primary-light),#5da8f0);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;flex-shrink:0;
}
.sidebar-brand .brand-text h2{font-size:14px;font-weight:600;line-height:1.3}
.sidebar-brand .brand-text p{font-size:11px;opacity:.6;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 10px}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;
  cursor:pointer;font-size:14px;color:rgba(255,255,255,.75);margin-bottom:2px;transition:all .2s;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;
  box-shadow:0 4px 12px rgba(46,126,201,.35);
}
.nav-item .icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;
  padding:1px 7px;border-radius:10px;min-width:18px;text-align:center;
}
.sidebar-footer{
  padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;opacity:.55;text-align:center;
}

/* 顶部条 */
.topbar{
  height:56px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 24px;flex-shrink:0;
}
.topbar .page-title{font-size:16px;font-weight:600;color:var(--text)}
.topbar .page-sub{font-size:12px;color:var(--text-3);margin-left:10px}
.topbar-spacer{flex:1}
.top-user{display:flex;align-items:center;gap:12px}
.top-user .el-avatar{background:var(--primary-light)!important;font-size:14px}
.top-user .who{text-align:right;line-height:1.2}
.top-user .who .name{font-size:13px;font-weight:500;color:var(--text)}
.top-user .who .role{font-size:11px;color:var(--text-3)}
.top-user .el-dropdown-link{cursor:pointer;display:flex;align-items:center;gap:8px}

/* 内容区 */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.content{flex:1;overflow-y:auto;padding:22px 26px}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

/* ====== 通用卡片 ====== */
.card{
  background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  border:1px solid var(--border);
}
.card-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-header h3{font-size:15px;font-weight:600;color:var(--text)}
.card-body{padding:20px}

/* ====== Dashboard ====== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
.stat-card{
  background:#fff;border-radius:12px;padding:20px 22px;border:1px solid var(--border);
  position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;
}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.stat-card .icon-bg{
  position:absolute;right:-18px;top:-18px;width:78px;height:78px;border-radius:50%;opacity:.12;
}
.stat-card .s-label{font-size:13px;color:var(--text-2);font-weight:500}
.stat-card .s-value{font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-1px}
.stat-card .s-unit{font-size:14px;color:var(--text-3);margin-left:3px;font-weight:400}
.stat-card .s-foot{font-size:12px;margin-top:8px;color:var(--text-3)}
.stat-card .s-foot.up{color:var(--success)}
.stat-card .s-foot.down{color:var(--danger)}
.stat-card.blue{border-left:4px solid var(--primary)}
.stat-card.blue .icon-bg{background:var(--primary)}
.stat-card.blue .s-value{color:var(--primary)}
.stat-card.green{border-left:4px solid var(--success)}
.stat-card.green .icon-bg{background:var(--success)}
.stat-card.green .s-value{color:var(--success)}
.stat-card.orange{border-left:4px solid var(--warning)}
.stat-card.orange .icon-bg{background:var(--warning)}
.stat-card.orange .s-value{color:var(--warning)}
.stat-card.red{border-left:4px solid var(--danger)}
.stat-card.red .icon-bg{background:var(--danger)}
.stat-card.red .s-value{color:var(--danger)}

.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:22px}
.chart-box{height:300px}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* 列表 */
.mini-list .list-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #edf2f7;
}
.mini-list .list-item:last-child{border-bottom:none}
.mini-list .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mini-list .txt{flex:1;min-width:0}
.mini-list .txt .t1{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-list .txt .t2{font-size:11px;color:var(--text-3);margin-top:3px}
.mini-list .tag{flex-shrink:0}

/* 表格页通用 */
.page-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
}
.page-head h2{font-size:18px;font-weight:700;color:var(--text)}
.page-head .sub{font-size:13px;color:var(--text-3);margin-top:4px}
.filter-bar{
  background:#fff;border-radius:12px;padding:16px 20px;border:1px solid var(--border);
  margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.filter-bar .el-form-item{margin-bottom:0}
.filter-bar .grow{flex:1}

/* 进度条样式 */
.progress-bar{
  height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;min-width:80px;
}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .4s}

/* 状态标签 */
.tag-green{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.tag-orange{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.tag-red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.tag-blue{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.tag-gray{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}

/* 法规依据样式 */
.law-basis{
  background:#f8fafc;border-left:3px solid var(--primary);
  padding:8px 12px;font-size:12px;color:var(--text-2);border-radius:0 6px 6px 0;
  margin-top:6px;line-height:1.6;
}

/* 小细节 */
.el-table th.el-table__cell{background:#f8fafc!important;color:var(--text-2);font-weight:600}
.el-button--primary{background:var(--primary)!important;border-color:var(--primary)!important}
.el-button--primary:hover{background:var(--primary-light)!important;border-color:var(--primary-light)!important}
.el-menu--horizontal{border-bottom:none!important}

/* 隐患级别 */
.level-major{background:linear-gradient(135deg,#dc2626,#f87171);color:#fff;border:none}
.level-general{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;border:none}

/* 空状态 */
.empty{
  text-align:center;padding:60px 20px;color:var(--text-3);
}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty .txt{font-size:14px}

/* 打印用 */
@media print{
  .sidebar,.topbar,.filter-bar,.no-print{display:none!important}
  .content{padding:0;background:#fff;overflow:visible}
  .card{box-shadow:none;border:1px solid #ddd}
}

/* 法律法规库 */
.law-card{padding:18px 22px;margin-bottom:14px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;border-left:4px solid #3b82f6}
.law-card:hover{border-color:#93c5fd;box-shadow:0 4px 16px rgba(59,130,246,.12);transform:translateY(-1px)}
.law-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.law-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.law-title .title-text{font-size:15px;font-weight:600;color:#0f172a}
.law-meta{font-size:12px;color:#94a3b8;white-space:nowrap;flex-shrink:0;padding-top:3px}
.law-summary{font-size:13px;color:#475569;line-height:1.7;margin-bottom:8px}
.law-points{background:#f1f5f9;border-radius:6px;padding:10px 14px;font-size:12.5px;color:#334155;line-height:1.7}
.law-points .points-label{font-weight:600;color:#1e40af;margin-bottom:4px}
.law-tag{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.admin-tag{background:#fef3c7;color:#92400e;border-color:#fde68a}
.dept-tag{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.norm-tag{background:#fce7f3;color:#9d174d;border-color:#fbcfe8}
.type-industry{color:#64748b}

.law-detail .detail-row{display:flex;padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:13.5px}
.law-detail .detail-row .label{width:80px;color:#64748b;flex-shrink:0;font-weight:500}
.law-detail .detail-row span:last-child{color:#0f172a}
.law-detail .detail-block{margin-top:16px}
.law-detail .detail-block .block-title{font-weight:600;color:#1e3a8a;font-size:14px;margin-bottom:8px;padding-left:10px;border-left:3px solid #3b82f6}
.law-detail .detail-block .block-content{font-size:13.5px;color:#334155;line-height:1.8;background:#f8fafc;border-radius:6px;padding:12px 14px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>

<script src="/libs/vue.js?v=1787016030"></script>
<script src="/libs/element-plus.js?v=1787016030"></script>
<script src="/libs/element-plus-zh.js?v=1787016030"></script>
<script src="/libs/ep-icons.js?v=1787016030"></script>
<script src="/libs/echarts.js?v=1787016030"></script>
<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick, watch, h } = Vue;

/* ====== API 助手 ====== */
const api = {
  async request(path, opts={}){
    const r = await fetch(path, {
      headers:{'Content-Type':'application/json',...(opts.headers||{})},
      credentials:'include',
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await r.json();
    if(data.code !== 0){ ElementPlus.ElMessage.error(data.message||'请求失败'); throw new Error(data.message); }
    return data.data;
  },
  get:(p)=>api.request(p),
  post:(p,b)=>api.request(p,{method:'POST',body:b}),
  put:(p,b)=>api.request(p,{method:'PUT',body:b}),
  del:(p)=>api.request(p,{method:'DELETE'})
};

/* ====== 登录组件 ====== */
const LoginComp = {
  emits:['success'],
  setup(_,{emit}){
    const form = reactive({username:'',password:''});
    const loading = ref(false);
    const submit = async()=>{
      if(!form.username||!form.password){ElementPlus.ElMessage.warning('请输入账号和密码');return;}
      loading.value = true;
      try{
        const data = await api.post('/api/auth/login', form);
        ElementPlus.ElMessage.success('登录成功，欢迎 '+data.user.real_name);
        emit('success', data.user);
      }catch(e){}finally{loading.value=false;}
    };
    const fill=(u,p)=>{form.username=u;form.password=p;};
    return {form,loading,submit,fill};
  },
  template:`
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">安</div>
        <h1>安全环保工作监督系统</h1>
        <p>水泥企业 · 安环部工作管理平台</p>
      </div>
      <el-form :model="form" @submit.prevent="submit" size="large">
        <el-form-item>
          <el-input v-model="form.username" placeholder="账号" :prefix-icon="'User'" clearable/>
        </el-form-item>
        <el-form-item>
          <el-input v-model="form.password" type="password" placeholder="密码" show-password @keyup.enter="submit" :prefix-icon="'Lock'"/>
        </el-form-item>
        <el-button type="primary" class="login-btn" :loading="loading" @click="submit">登 录</el-button>
      </el-form>
      <div class="login-tip">
        演示账号：
        <span @click="fill('admin','123456')">admin</span> /
        <span @click="fill('anhuabu','123456')">安环部</span> /
        <span @click="fill('ceo','123456')">总经理</span>
        （密码均为 123456）
      </div>
    </div>
  </div>`
};

/* ====== Dashboard ====== */
const DashboardComp = {
  props:['user'],
  setup(props){
    const year = ref(new Date().getFullYear());
    const month = ref(new Date().getMonth()+1);
    const loading = ref(true);
    const data = reactive({
      month:{complete_rate:0,total:0,done:0,overdue:0},
      year:{complete_rate:0,total:0,done:0},
      hazard:{complete_rate:0,total:0,done:0,pending:0,overdue:0},
      trend:[],hazard_status:[],
      upcoming:[],unclosed:[],recent_checks:[]
    });
    const trendRef = ref(null), hazardRef = ref(null);
    let trendChart=null, hazardChart=null;

    const load = async()=>{
      loading.value = true;
      try{
        const d = await api.get('/api/report/dashboard?year='+year.value);
        Object.assign(data, d);
        await nextTick();
        renderTrend();
        renderHazardStatus();
      }catch(e){}
      loading.value = false;
    };

    const renderTrend = ()=>{
      if(!trendRef.value) return;
      trendChart = trendChart || echarts.init(trendRef.value);
      const months = data.trend.map(t=>t.month+'月');
      trendChart.setOption({
        tooltip:{trigger:'axis'},
        legend:{data:['计划完成率','隐患整改率'],right:0,top:0,textStyle:{fontSize:12}},
        grid:{left:36,right:16,top:40,bottom:30},
        xAxis:{type:'category',data:months,axisLine:{lineStyle:{color:'#e2e8f0'}},axisLabel:{color:'#94a3b8'}},
        yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%',color:'#94a3b8'},splitLine:{lineStyle:{color:'#f1f5f9'}}},
        series:[
          {name:'计划完成率',type:'line',smooth:true,data:data.trend.map(t=>t.plan_rate),
           itemStyle:{color:'#1d5fa4'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(29,95,164,.25)'},{offset:1,color:'rgba(29,95,164,0)'}]}}},
          {name:'隐患整改率',type:'line',smooth:true,data:data.trend.map(t=>t.hazard_rate),
           itemStyle:{color:'#16a34a'},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(22,163,74,.2)'},{offset:1,color:'rgba(22,163,74,0)'}]}}}
        ]
      });
    };

    const renderHazardStatus = ()=>{
      if(!hazardRef.value) return;
      hazardChart = hazardChart || echarts.init(hazardRef.value);
      hazardChart.setOption({
        tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
        legend:{bottom:0,textStyle:{fontSize:12}},
        series:[{
          type:'pie',radius:['50%','75%'],center:['50%','42%'],
          avoidLabelOverlap:true,itemStyle:{borderRadius:4,borderColor:'#fff',borderWidth:2},
          label:{show:true,formatter:'{b}\n{c}',fontSize:12},
          data:(data.hazard_status.length?data.hazard_status:[
            {name:'已完成',value:data.hazard.done,itemStyle:{color:'#16a34a'}},
            {name:'整改中',value:data.hazard.total-data.hazard.done-data.hazard.overdue,itemStyle:{color:'#f59e0b'}},
            {name:'超期未改',value:data.hazard.overdue,itemStyle:{color:'#dc2626'}},
          ]).map((d,i)=>{
            const colors=['#16a34a','#f59e0b','#dc2626','#1d5fa4'];
            return d.itemStyle?d:{...d,itemStyle:{color:colors[i%colors.length]}};
          })
        }]
      });
    };

    const onResize = ()=>{trendChart&&trendChart.resize();hazardChart&&hazardChart.resize();};

    onMounted(()=>{load();window.addEventListener('resize',onResize);});
    onUnmounted(()=>{window.removeEventListener('resize',onResize);trendChart&&trendChart.dispose();hazardChart&&hazardChart.dispose();});

    return {data,loading,year,month,load,trendRef,hazardRef};
  },
  template:`
  <div>
    <div class="stat-row">
      <div class="stat-card blue">
        <div class="icon-bg"></div>
        <div class="s-label">本月工作计划完成率</div>
        <div class="s-value">{{data.month.complete_rate}}<span class="s-unit">%</span></div>
        <div class="s-foot">共 {{data.month.total}} 项 · 已完成 {{data.month.done}} 项</div>
      </div>
      <div class="stat-card green">
        <div class="icon-bg"></div>
        <div class="s-label">年度工作计划完成率</div>
        <div class="s-value">{{data.year.complete_rate}}<span class="s-unit">%</span></div>
        <div class="s-foot">年度累计 {{data.year.done}} / {{data.year.total}} 项</div>
      </div>
      <div class="stat-card orange">
        <div class="icon-bg"></div>
        <div class="s-label">隐患整改闭环率</div>
        <div class="s-value">{{data.hazard.complete_rate}}<span class="s-unit">%</span></div>
        <div class="s-foot">在库 {{data.hazard.total}} 条 · 待整改 {{data.hazard.pending}} 条</div>
      </div>
      <div class="stat-card red">
        <div class="icon-bg"></div>
        <div class="s-label">超期未闭环</div>
        <div class="s-value">{{data.hazard.overdue + data.month.overdue}}<span class="s-unit">项</span></div>
        <div class="s-foot">隐患超期 {{data.hazard.overdue}} 条 · 计划超期 {{data.month.overdue}} 项</div>
      </div>
    </div>

    <div class="chart-row">
      <div class="card">
        <div class="card-header">
          <h3>月度完成情况趋势（近12个月）</h3>
          <el-select v-model="year" size="small" style="width:100px" @change="load">
            <el-option :value="2025" label="2025"/>
            <el-option :value="2026" label="2026"/>
            <el-option :value="2027" label="2027"/>
          </el-select>
        </div>

/* ====== 工作计划 ====== */
const WorkPlanComp = {
  props:['user'],
  setup(props){
    const year = ref(new Date().getFullYear());
    const typeFilter = ref('');
    const keyword = ref('');
    const list = ref([]);
    const total = ref(0);
    const page = ref(1);
    const pageSize = ref(10);
    const dialog = reactive({show:false,edit:null,data:defaultPlan()});
    const view = ref('plan');

    const dutyList = ref([]);
    const dutyStats = ref({});

    function defaultPlan(){
      const d = new Date();
      return {title:'',category:'',type:'月度',plan_year:d.getFullYear(),plan_month:d.getMonth()+1,
        content:'',law_basis:'',responsible:'',deadline:d.toISOString().slice(0,10),progress:0,status:'pending'};
    }

    const load = async()=>{
      let url = '/api/workplan/list?year='+year.value+'&page='+page.value+'&size='+pageSize.value;
      if(typeFilter.value) url += '&type='+typeFilter.value;
      if(keyword.value) url += '&keyword='+encodeURIComponent(keyword.value);
      try{
        const d = await api.get(url);
        list.value = d.items||d; total.value = d.total||d.length;
      }catch(e){}
    };

    const loadDuties = async()=>{
      try{
        const d = await api.get('/api/workplan/list?category='+encodeURIComponent('安全职责')+'&year='+year.value);
        dutyList.value = d.data || [];
        const stats = {};
        for(const role of ['主要负责人','分管负责人','安全管理员']){
          const items = dutyList.value.filter(x=>x.responsible===role);
          const done = items.filter(x=>x.progress>=100).length;
          const inp = items.filter(x=>x.progress>0 && x.progress<100).length;
          const totalP = items.reduce((s,x)=>s+(x.progress||0),0);
          stats[role] = {total:items.length, done, inp, avg: items.length? Math.round(totalP/items.length):0};
        }
        dutyStats.value = stats;
      }catch(e){}
    };

    const openAdd = ()=>{dialog.edit=null;dialog.data=defaultPlan();dialog.show=true;};
    const openEdit = (row)=>{dialog.edit=row.id;dialog.data={...row};dialog.show=true;};

    const save = async()=>{
      if(!dialog.data.title){ElementPlus.ElMessage.warning('请填写计划名称');return;}
      try{
        if(dialog.edit){await api.put('/api/workplan/'+dialog.edit, dialog.data);ElementPlus.ElMessage.success('已更新');}
        else{await api.post('/api/workplan/', dialog.data);ElementPlus.ElMessage.success('已新增');}
        dialog.show=false; view.value==='duty'? loadDuties():load();
      }catch(e){}
    };

    const remove = async(row)=>{
      try{
        await ElementPlus.ElMessageBox.confirm('确定删除此工作计划？','确认',{type:'warning'});
        await api.del('/api/workplan/'+row.id);
        ElementPlus.ElMessage.success('已删除'); view.value==='duty'? loadDuties():load();
      }catch(e){}
    };

    const quickProgress = (row)=>{
      ElementPlus.ElMessageBox.prompt('更新进度百分比（0-100）','更新进度',{
        inputValue:row.progress,inputPattern:/^(100|[0-9]?\d)$/,inputErrorMessage:'请输入 0-100 的整数'
      }).then(async({value})=>{
        row.progress = parseInt(value);
        row.status = row.progress>=100?'completed':row.progress===0?'pending':'in_progress';
        await api.put('/api/workplan/'+row.id, {progress:row.progress, status:row.status});
        ElementPlus.ElMessage.success('已更新'); view.value==='duty'? loadDuties():load();
      }).catch(()=>{});
    };

    onMounted(load);

    const statusMap = {pending:{t:'待开始',c:'tag-gray'},in_progress:{t:'进行中',c:'tag-blue'},completed:{t:'已完成',c:'tag-green'},overdue:{t:'已超期',c:'tag-red'}};
    const roleMeta = {
      '主要负责人':{icon:'👑',color:'#dc2626',bg:'#fef2f2',border:'#fecaca',desc:'安全生产第一责任人，对本单位安全生产工作全面负责',law:'《安全生产法》第五条、第二十一条'},
      '分管负责人':{icon:'🎖️',color:'#2563eb',bg:'#eff6ff',border:'#bfdbfe',desc:'协助主要负责人统筹安全生产，分管安环部日常工作',law:'《安全生产法》第二十一条'},
      '安全管理员':{icon:'🛡️',color:'#16a34a',bg:'#f0fdf4',border:'#bbf7d0',desc:'具体负责安全生产日常管理，隐患排查、教育培训、应急管理等',law:'《安全生产法》第二十五条'},
    };
    const dutiesOf = (role)=> dutyList.value.filter(function(x){return x.responsible===role;});
    const dutyCount = (role)=> dutiesOf(role).length;
    const onTabChange = (t)=>{ if(t==='duty') loadDuties(); else load(); };
    const pad2 = (n)=>{ const s=''+n; return s.length<2?'0'+s:s; };
    const dutyStatOf = (role)=> dutyStats.value[role] || {};
    const dutyProgressStyle = (role, meta)=>{
      const avg = (dutyStats.value[role]||{}).avg || 0;
      return { width: avg+'%', background: meta.color, height: '100%', borderRadius: '2px' };
    };
    const progressColor = (p)=>{ if(p>=100) return '#16a34a'; if(p>=50) return '#f59e0b'; return '#cbd5e1'; };
    const progressBarStyle = (p,h)=>{ h = h || '3px'; return { width: p+'%', background: progressColor(p), height: '100%', borderRadius: h }; };

    return {year,typeFilter,keyword,list,total,page,pageSize,dialog,view,dutyList,dutyStats,roleMeta,load,openAdd,openEdit,save,remove,quickProgress,statusMap,dutiesOf,dutyCount,onTabChange,pad2,dutyStatOf,dutyProgressStyle,progressColor,progressBarStyle};

const HazardComp = {
  props:['user'],
  setup(props){
    const list = ref([]);
    const loading = ref(true);
    const statusFilter = ref('');
    const levelFilter = ref('');
    const dialog = reactive({show:false,edit:null,data:defaultHazard()});
    function defaultHazard(){
      const d=new Date(); const dl=new Date(d.getTime()+7*86400000);
      return{check_date:d.toISOString().slice(0,10),location:'',description:'',level:'general',
        source:'日常检查',responsible:'',rectify_measure:'',deadline:dl.toISOString().slice(0,10),
        rectify_progress:0,status:'pending',accept_note:''};
    }

    const load = async()=>{
      loading.value = true;
      try{
        let url='/api/hazard/list?';
        if(statusFilter.value) url+='status='+statusFilter.value+'&';
        if(levelFilter.value) url+='level='+levelFilter.value+'&';
        const d = await api.get(url); list.value = d||[];
      }catch(e){}
      loading.value=false;
    };

    const openAdd=()=>{dialog.edit=null;dialog.data=defaultHazard();dialog.show=true;};
    const openEdit=(row)=>{dialog.edit=row.id;dialog.data={...row};dialog.show=true;};
    const save=async()=>{
      if(!dialog.data.description){ElementPlus.ElMessage.warning('请填写隐患描述');return;}
      try{
        if(dialog.edit) await api.put('/api/hazard/'+dialog.edit,dialog.data);
        else await api.post('/api/hazard/',dialog.data);
        ElementPlus.ElMessage.success('已保存');dialog.show=false;load();
      }catch(e){}
    };
    const remove=async(row)=>{
      try{await ElementPlus.ElMessageBox.confirm('确定删除？','确认',{type:'warning'});
        await api.del('/api/hazard/'+row.id);ElementPlus.ElMessage.success('已删除');load();}catch(e){}
    };
    const quickRectify=async(row)=>{
      ElementPlus.ElMessageBox.prompt('整改进度（%）','更新整改',{inputValue:row.rectify_progress}).then(async({value})=>{
        const p=parseInt(value);
        if(p>=100){
          try{await ElementPlus.ElMessageBox.confirm('整改完成，是否提交验收？','确认',{type:'info'});
            row.rectify_progress=100;row.status='rectified';}catch(e){row.rectify_progress=p;}
        }else{row.rectify_progress=p;row.status='rectifying';}
        await api.put('/api/hazard/'+row.id,{rectify_progress:row.rectify_progress,status:row.status});
        ElementPlus.ElMessage.success('已更新');load();
      }).catch(()=>{});
    };
    const accept=async(row)=>{
      try{await ElementPlus.ElMessageBox.confirm('确认验收通过，隐患闭环？','验收确认',{type:'success'});
        await api.put('/api/hazard/'+row.id,{status:'closed'});
        ElementPlus.ElMessage.success('已闭环');load();}catch(e){}
    };

    const statusMap={pending:'待整改',rectifying:'整改中',rectified:'待验收',closed:'已闭环'};

    onMounted(load);
    return {list,loading,statusFilter,levelFilter,dialog,load,openAdd,openEdit,save,remove,quickRectify,accept,statusMap};
  },

/* ====== 统计报表 ====== */
const ReportComp = {
  setup(){
    const year = ref(new Date().getFullYear());
    const month = ref(new Date().getMonth()+1);
    const loading = ref(false);
    const charts = {trend:null,cat:null,hazard:null,compliance:null};
    const refs = {trend:ref(null),cat:ref(null),hazard:ref(null),compliance:ref(null)};
    const summary = ref({});

    const render = async()=>{
      loading.value=true;
      try{
        const d = await api.get('/api/report/dashboard?year='+year.value);
        summary.value = d;
        await nextTick();
        drawTrend(d.trend||[]);
        drawCat(d.category_stats||[]);
        drawHazard(d.hazard_status||[]);
      }catch(e){}
      loading.value=false;
    };

    const drawTrend=(trend)=>{
      if(!refs.trend.value) return;
      charts.trend = charts.trend || echarts.init(refs.trend.value);
      charts.trend.setOption({
        tooltip:{trigger:'axis'},
        legend:{data:['计划完成率','隐患整改率'],right:0},
        grid:{left:40,right:20,top:40,bottom:30},
        xAxis:{type:'category',data:trend.map(t=>t.month+'月'),axisLine:{lineStyle:{color:'#e2e8f0'}}},
        yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%'},splitLine:{lineStyle:{color:'#f1f5f9'}}},
        series:[
          {name:'计划完成率',type:'bar',data:trend.map(t=>t.plan_rate),itemStyle:{color:'#1d5fa4',borderRadius:[4,4,0,0]},barWidth:14},
          {name:'隐患整改率',type:'bar',data:trend.map(t=>t.hazard_rate),itemStyle:{color:'#16a34a',borderRadius:[4,4,0,0]},barWidth:14}
        ]
      });
    };

    const drawCat=(cats)=>{
      if(!refs.cat.value) return;
      charts.cat = charts.cat || echarts.init(refs.cat.value);
      charts.cat.setOption({
        tooltip:{trigger:'axis'},
        grid:{left:100,right:20,top:20,bottom:20},
        xAxis:{type:'value',axisLabel:{formatter:'{value}%'}},
        yAxis:{type:'category',data:cats.map(c=>c.name).reverse()},
        series:[{
          type:'bar',data:cats.map(c=>c.rate).reverse(),barWidth:16,
          itemStyle:{borderRadius:[0,8,8,0],color:(p)=>{
            const v=p.value;return v>=90?'#16a34a':v>=70?'#f59e0b':'#dc2626';
          }},
          label:{show:true,position:'right',formatter:'{c}%',fontSize:12}
        }]
      });
    };

    const drawHazard=(hs)=>{
      if(!refs.hazard.value) return;
      charts.hazard = charts.hazard || echarts.init(refs.hazard.value);
      charts.hazard.setOption({
        tooltip:{trigger:'item'},
        legend:{bottom:0},
        series:[{type:'pie',radius:['45%','70%'],center:['50%','42%'],
          itemStyle:{borderRadius:4,borderColor:'#fff',borderWidth:2},
          data:(hs.length?hs:[{name:'已闭环',value:summary.value.hazard?.done||0,itemStyle:{color:'#16a34a'}},
            {name:'整改中',value:(summary.value.hazard?.total||0)-(summary.value.hazard?.done||0)-(summary.value.hazard?.overdue||0),itemStyle:{color:'#f59e0b'}},
            {name:'超期未改',value:summary.value.hazard?.overdue||0,itemStyle:{color:'#dc2626'}}
          ])}]
      });
    };

    const doExport = ()=>{
      const url = '/api/report/export?year='+year.value+'&month='+month.value;
      window.location.href = url;
    };

    const onResize=()=>{Object.values(charts).forEach(c=>c&&c.resize());};

    onMounted(()=>{render();window.addEventListener('resize',onResize);});
    onUnmounted(()=>{window.removeEventListener('resize',onResize);Object.values(charts).forEach(c=>c&&c.dispose());});

    return {year,month,loading,summary,refs,render,doExport};
  },
  template:`
  <div>
    <div class="page-head">
      <div><h2>统计报表分析</h2><div class="sub">多维度统计分析，支持 Excel 一键导出</div></div>
      <div style="display:flex;gap:10px">
        <el-select v-model="year" style="width:100px" @change="render">
          <el-option :value="2025" label="2025"/><el-option :value="2026" label="2026"/><el-option :value="2027" label="2027"/>
        </el-select>
        <el-select v-model="month" style="width:90px">
          <el-option v-for="m in 12" :key="m" :value="m" :label="m+'月'"/>
        </el-select>
        <el-button type="primary" @click="doExport" :icon="Download">导出 Excel</el-button>
      </div>
    </div>
    <div v-loading="loading">
      <div class="chart-row">
        <div class="card"><div class="card-header"><h3>月度完成率对比（柱状）</h3></div>
          <div class="card-body"><div ref="refs.trend" style="height:320px"></div></div></div>
        <div class="card"><div class="card-header"><h3>隐患状态占比</h3></div>
          <div class="card-body"><div ref="refs.hazard" style="height:320px"></div></div></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>各工作类别完成率</h3></div>
        <div class="card-body"><div ref="refs.cat" style="height:320px"></div></div>
      </div>
    </div>
  </div>`
};

const SystemComp = {
  props:['user'],
  setup(props){
    const tab = ref('users');
    const users = ref([]);
    const roles = ref([]);
    const permissions = ref([]);
    const loading = ref(true);
    const canEditRole = computed(function(){
      const p = props.user && props.user.permissions;
      if(!p) return false;
      return p.indexOf('system.role') >= 0;
    });

    const userDialog = reactive({show:false,edit:null,data:defaultUser()});
    function defaultUser(){return{username:'',real_name:'',role_id:1,department:'',phone:'',password:'123456'};}

    const roleDialog = reactive({show:false,edit:null,data:defaultRole()});
    function defaultRole(){return{name:'',description:'',permissions:[]};}

    const load = async()=>{
      loading.value=true;
      try{
        const [u,r,p]=await Promise.all([
          api.get('/api/system/users'),
          api.get('/api/system/roles'),
          api.get('/api/system/permissions'),
        ]);
        users.value=u||[];
        roles.value=r||[];
        permissions.value=p||[];
      }catch(e){}
      loading.value=false;
    };

    const roleName = (rid)=>{ const r=roles.value.find(function(x){return x.id===rid;}); return r?r.name:'未知'; };

    const openAddUser=()=>{userDialog.edit=null;userDialog.data=defaultUser();userDialog.show=true;};
    const openEditUser=(row)=>{userDialog.edit=row.id;userDialog.data={...row,password:''};userDialog.show=true;};
    const saveUser=async()=>{
      if(!userDialog.data.username||!userDialog.data.real_name){ElementPlus.ElMessage.warning('账号和姓名必填');return;}
      try{
        if(userDialog.edit){await api.put('/api/system/user/'+userDialog.edit,userDialog.data);}
        else{await api.post('/api/system/user/',userDialog.data);}
        ElementPlus.ElMessage.success('已保存');userDialog.show=false;load();
      }catch(e){}
    };
    const removeUser=async(row)=>{
      if(row.username==='admin'){ElementPlus.ElMessage.warning('不能删除超级管理员');return;}
      try{await ElementPlus.ElMessageBox.confirm('确定删除用户？','确认',{type:'warning'});
        await api.del('/api/system/user/'+row.id);ElementPlus.ElMessage.success('已删除');load();}catch(e){}
    };
    const resetPwd=async(row)=>{
      try{await ElementPlus.ElMessageBox.prompt('重置密码为','重置密码',{inputValue:'123456'}).then(async function(res){
        await api.put('/api/system/user/'+row.id,{password:res.value});ElementPlus.ElMessage.success('已重置');});
      }catch(e){}
    };

    const openAddRole=()=>{roleDialog.edit=null;roleDialog.data=defaultRole();roleDialog.show=true;};
    const openEditRole=(row)=>{roleDialog.edit=row.id;roleDialog.data={name:row.name,description:row.description,permissions:(row.permissions||[]).slice()};roleDialog.show=true;};
    const saveRole=async()=>{
      if(!roleDialog.data.name){ElementPlus.ElMessage.warning('角色名必填');return;}
      try{
        if(roleDialog.edit){await api.put('/api/system/roles/'+roleDialog.edit,roleDialog.data);}
        else{await api.post('/api/system/roles/',roleDialog.data);}
        ElementPlus.ElMessage.success('已保存');roleDialog.show=false;load();
      }catch(e){}
    };
    const removeRole=async(row)=>{
      try{await ElementPlus.ElMessageBox.confirm('删除角色将影响拥有该角色的用户，确定？','确认',{type:'warning'});
        await api.del('/api/system/roles/'+row.id);ElementPlus.ElMessage.success('已删除');load();}catch(e){}
    };
    const togglePerm = (code)=>{
      const list = roleDialog.data.permissions;
      const idx = list.indexOf(code);
      if(idx>=0){list.splice(idx,1);}else{list.push(code);}
    };
    const hasPerm = (code)=>{ return roleDialog.data.permissions.indexOf(code) >= 0; };
    const rolePermCount = (row)=>{ return (row.permissions||[]).length; };

    const groupedPerms = computed(function(){
      const groups = {};
      permissions.value.forEach(function(p){
        const m = p.module || '其他';
        if(!groups[m]) groups[m]=[];
        groups[m].push(p);
      });
      return groups;
    });
    const permModules = computed(function(){ return Object.keys(groupedPerms.value); });

    onMounted(load);
    return {tab,users,roles,permissions,loading,canEditRole,
      userDialog,openAddUser,openEditUser,saveUser,removeUser,resetPwd,
      roleDialog,openAddRole,openEditRole,saveRole,removeRole,togglePerm,hasPerm,rolePermCount,
      groupedPerms,permModules,roleName,load};
  },
  template:`
  <div>
    <div class="page-head">
      <div><h2>系统设置</h2><div class="sub">用户账号、角色权限配置 — 支持多系统扩展接入</div></div>

              <template #default="{row}">

              </template>
            </el-table-column>
            <el-table-column prop="department" label="部门" width="130"/>
            <el-table-column prop="phone" label="电话" width="130"/>
            <el-table-column label="权限数" width="80" align="center">
              <template #default="{row}">
                <span style="color:#3b82f6">{{(row.permissions||[]).length}}</span>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="220" fixed="right">
              <template #default="{row}">
                <el-button size="small" link type="primary" @click="openEditUser(row)">编辑</el-button>
                <el-button size="small" link type="warning" @click="resetPwd(row)">重置密码</el-button>
                <el-button size="small" link type="danger" @click="removeUser(row)" :disabled="row.username==='admin'">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </el-tab-pane>

      <el-tab-pane label="角色权限" name="roles">
        <div class="card" style="margin-bottom:12px">
          <el-button type="primary" @click="openAddRole" :icon="Plus" size="small" :disabled="!canEditRole">新增角色</el-button>
          <span v-if="!canEditRole" style="color:#94a3b8;font-size:12px;margin-left:12px">需「角色权限管理」权限</span>
        </div>
        <div class="card">
          <el-table :data="roles" border stripe v-loading="loading" size="small">
            <el-table-column type="index" width="50"/>

            <el-table-column label="已分配权限" width="120" align="center">
              <template #default="{row}">
                <el-tag size="small" type="info">{{rolePermCount(row)}} 项</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="180" fixed="right">
              <template #default="{row}">
                <el-button size="small" link type="primary" @click="openEditRole(row)">编辑权限</el-button>
                <el-button size="small" link type="danger" @click="removeRole(row)" :disabled="!canEditRole">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </el-tab-pane>

      <el-tab-pane label="权限总览" name="permissions">
        <div class="card">
          <div v-for="mod in permModules" :key="mod" style="margin-bottom:16px">
            <div style="font-weight:600;color:#475569;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #e2e8f0">{{mod}} ({{groupedPerms[mod].length}}项)</div>
            <el-tag v-for="p in groupedPerms[mod]" :key="p.code" size="small" effect="plain" style="margin:3px 5px 3px 0">
              {{p.name}} <span style="color:#94a3b8;font-size:11px">[{{p.code}}]</span>
            </el-tag>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>

    <el-dialog v-model="userDialog.show" :title="userDialog.edit?'编辑用户':'新增用户'" width="500px" :close-on-click-modal="false">
      <el-form :model="userDialog.data" label-width="80px" size="default">
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="账号"><el-input v-model="userDialog.data.username" :disabled="!!userDialog.edit"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="姓名"><el-input v-model="userDialog.data.real_name"/></el-form-item></el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="角色">
            <el-select v-model="userDialog.data.role_id" style="width:100%">
              <el-option v-for="r in roles" :key="r.id" :value="r.id" :label="r.name"/>
            </el-select>
          </el-form-item></el-col>
          <el-col :span="12"><el-form-item label="部门"><el-input v-model="userDialog.data.department"/></el-form-item></el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="电话"><el-input v-model="userDialog.data.phone"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item :label="userDialog.edit?'新密码':'初始密码'">
            <el-input v-model="userDialog.data.password" type="password" :placeholder="userDialog.edit?'留空不修改':'默认 123456'" show-password/>
          </el-form-item></el-col>
        </el-row>
      </el-form>
      <template #footer>
        <el-button @click="userDialog.show=false">取消</el-button>
        <el-button type="primary" @click="saveUser">保存</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="roleDialog.show" :title="roleDialog.edit?'编辑角色权限':'新增角色'" width="620px" :close-on-click-modal="false">
      <el-form :model="roleDialog.data" label-width="80px">
        <el-form-item label="角色名"><el-input v-model="roleDialog.data.name"/></el-form-item>
        <el-form-item label="说明"><el-input v-model="roleDialog.data.description" type="textarea" :rows="2"/></el-form-item>
      </el-form>
      <div style="max-height:340px;overflow-y:auto;border-top:1px solid #e2e8f0;padding-top:12px">
        <div v-for="mod in permModules" :key="mod" style="margin-bottom:12px">
          <div style="font-size:12px;color:#64748b;margin-bottom:6px;font-weight:600">{{mod}}</div>
          <el-checkbox v-for="p in groupedPerms[mod]" :key="p.code" :model-value="hasPerm(p.code)" @change="togglePerm(p.code)" size="default" style="margin:3px 10px 3px 0">
            {{p.name}}
          </el-checkbox>
        </div>
      </div>
      <template #footer>
        <el-button @click="roleDialog.show=false">取消</el-button>
        <el-button type="primary" @click="saveRole">保存</el-button>
      </template>
    </el-dialog>
  </div>`
};

/* ====== 主布局 ====== */
const MainLayout = {
  props:['user'],
  emits:['logout'],
  setup(props,{emit}){
    const menuPermMap={
      dashboard:'dashboard.view',
      workplan:'workplan.view',
      inspection:'inspection.view',
      hazard:'hazard.view',
      permit:'permit.view',
      contractor:'contractor.view',
      cost:'cost.view',
      accident:'accident.view',
      report:'report.view',
      law:'law.view',
      standard:'standard.view',
      system:'system.user',
    };
    const allMenus=[
      {key:'dashboard',icon:'📊',label:'首页看板'},
      {key:'workplan',icon:'📋',label:'工作计划管理'},
      {key:'inspection',icon:'🔍',label:'安全检查记录'},
      {key:'hazard',icon:'⚠️',label:'隐患台账管理',badge:true},
      {key:'permit',icon:'🔥',label:'危险作业票',badge:true},
      {key:'contractor',icon:'🏗️',label:'承包商档案'},
      {key:'cost',icon:'💰',label:'安全投入台账'},
      {key:'accident',icon:'🚨',label:'事故记录'},
      {key:'report',icon:'📈',label:'统计报表分析'},
      {key:'law',icon:'📖',label:'法律法规库'},
      {key:'standard',icon:'📚',label:'检查标准库'},
      {key:'system',icon:'⚙️',label:'系统设置'},
    ];
    const userPerms = computed(function(){
      const p = props.user && props.user.permissions;
      return p || [];
    });
    const menus = computed(function(){
      return allMenus.filter(function(m){
        const code = menuPermMap[m.key];
        if(!code) return true;
        return userPerms.value.indexOf(code) >= 0;
      });
    });
    const pageMap={
      dashboard:{title:'首页看板',sub:'安全生产与环保工作实时监控'},
      workplan:{title:'工作计划管理',sub:'按月度/季度/年度跟踪安环部任务完成情况'},
      inspection:{title:'安全检查记录',sub:'登记日常巡检、专项检查、季节性检查结果'},
      hazard:{title:'隐患台账管理',sub:'隐患登记→整改→验收的闭环管理'},
      permit:{title:'危险作业票管理',sub:'动火/有限空间/高处等八大特殊作业全流程票证管理'},
      contractor:{title:'承包商资质档案',sub:'外包外委单位准入审查、安全协议、履约评价'},
      cost:{title:'安全投入台账',sub:'按法规要求足额提取和使用安全生产费用的专项台账'},
      accident:{title:'事故记录管理',sub:'事故报告、调查、整改闭环的全过程记录'},
      report:{title:'统计报表分析',sub:'多维度数据分析，支持报表导出'},
      law:{title:'法律法规库',sub:'工贸行业、劳动密集型企业安全生产法律法规索引与要点'},
      standard:{title:'安全检查标准库',sub:'水泥企业安全生产标准化关键检查项'},
      system:{title:'系统设置',sub:'用户管理与权限配置'},
    };
    const active = ref('dashboard');
    const go = (k)=>active.value=k;
    const doLogout = async()=>{
      try{await api.post('/api/auth/logout');}catch(e){}
      ElementPlus.ElMessage.success('已注销');emit('logout');
    };
    const onCommand = (c)=>{ if(c==='logout') doLogout(); };
    const showName = computed(()=>props.user?.real_name||props.user?.username||'用户');
    const showRole = computed(()=>props.user?.role_name||'用户');
    return {menus,pageMap,active,go,doLogout,onCommand,showName,showRole};
  },
  template:`
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-mini">安</div>
        <div class="brand-text"><h2>Envsafe</h2><p>安全环保监督系统</p></div>
      </div>
      <nav class="sidebar-nav">
        <div v-for="m in menus" :key="m.key" class="nav-item" :class="{active:active===m.key}" @click="go(m.key)">
          <span class="icon">{{m.icon}}</span><span>{{m.label}}</span>
          <span class="nav-badge" v-if="m.badge">!</span>
        </div>
      </nav>
      <div class="sidebar-footer">v1.0 · 水泥企业版</div>
    </aside>
    <section class="main">
      <header class="topbar">
        <div class="page-title">{{pageMap[active].title}}</div>
        <div class="page-sub">{{pageMap[active].sub}}</div>
        <div class="topbar-spacer"></div>
        <el-dropdown class="top-user" trigger="click" @command="onCommand">
          <div class="el-dropdown-link">
            <el-avatar :size="34">{{showName[0]}}</el-avatar>
            <div class="who"><div class="name">{{showName}}</div><div class="role">{{showRole}}</div></div>
            <span style="color:#94a3b8">▾</span>
          </div>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item command="logout">退出登录</el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </header>
      <main class="content">
        <DashboardComp v-if="active==='dashboard'" :user="user"/>
<WorkPlanComp v-else-if="active==='workplan'" :user="user"/>
<InspectionComp v-else-if="active==='inspection'"/>
<HazardComp v-else-if="active==='hazard'" :user="user"/>
<WorkPermitComp v-else-if="active==='permit'"/>
<ContractorComp v-else-if="active==='contractor'"/>
<SafetyCostComp v-else-if="active==='cost'"/>
<AccidentComp v-else-if="active==='accident'"/>
<ReportComp v-else-if="active==='report'"/>
<LawReferenceComp v-else-if="active==='law'"/>
<StandardComp v-else-if="active==='standard'"/>
<SystemComp v-else-if="active==='system'" :user="user"/>
      </main>
    </section>
  </div>`
};

/* ====== 根组件 ====== */
const App = {
  setup(){
    const user = ref(null);
    const init = async()=>{
      try{const u = await api.get('/api/auth/me'); user.value=u;}catch(e){}
    };
    onMounted(init);
    const onLogin = (u)=>{user.value=u;};
    const onLogout = ()=>{user.value=null;};
    return {user,onLogin,onLogout};
  },
  template:`
  <LoginComp v-if="!user" @success="onLogin"/>
  <MainLayout v-else :user="user" @logout="onLogout"/>`
};

const app = createApp(App);
app.config.errorHandler = (err,vm,info)=>{
  console.error('[Vue Error]', info, err);
  document.querySelectorAll('.vue-err-banner').forEach(n=>n.remove());
  const d=document.createElement('div');
  d.className='vue-err-banner';
  d.style.cssText='position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:12px 20px;z-index:99999;font:13px/1.6 system-ui';
  d.textContent='Vue错误 ['+info+']: '+err.message;
  document.body.appendChild(d);
};
app.config.warnHandler = (msg,vm,trace)=>{console.warn('[Vue Warn]',msg,trace);};
window.addEventListener('error',e=>{console.error('[Window Error]',e.message,e.filename,e.lineno);});
for(const [k,v] of Object.entries(ElementPlusIconsVue)){
  app.component(k, v);
}
const comps = {LoginComp,DashboardComp,WorkPlanComp,InspectionComp,HazardComp,WorkPermitComp,ContractorComp,SafetyCostComp,AccidentComp,ReportComp,LawReferenceComp,StandardComp,SystemComp,MainLayout};
for(const [k,v] of Object.entries(comps)){
  app.component(k, v);
}
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
